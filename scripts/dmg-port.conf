# dmg-port.conf -- alephone's settings for the shared deploy-dmg.sh and
# smoke-dmg.sh (old-mac-build-host#96). Port-owned, never synced. Sourced by bash.

PORT=alephone
DMG_PREFIX='Marathon-OldMac-'

# The DMG holds one folder, "Aleph One/": the app plus the Marathon data it
# reads beside it (Map.scen, Shapes.shps, Sounds.sndz, Physics.phys, Music/,
# Plugins/, Scripts/, Scenarios/ with all three games). All of it ships with the
# release, so the deploy owns every top-level entry. Nothing user-owned lives
# here (prefs and saves are in ~/Library), so no DATA_DIR.
IMAGE_ROOT='Aleph One'
INSTALL_DIR='/Applications/Aleph One'
OWNED=('*')
VERIFY=('Aleph One.app/Contents/MacOS/Aleph One')

PROC='Aleph One'
SMOKE_APP='Aleph One.app'
# Direct exec: the engine does not reliably exit on a bare SIGTERM (#32).
KILL_OK=yes
# The G3 needs most of this to reach the chooser.
SMOKE_SECS=20
# No args: the built-in scenario chooser opens and the process stays up.
SMOKE_ARGS=()
# The i386 slice can only be smoked with `arch -i386` on the Core 2 minis (#30):
#   ALEPHONE_SMOKE_ARCH=i386 scripts/smoke-dmg.sh mini-intel
SMOKE_ARCH="${ALEPHONE_SMOKE_ARCH:-}"
